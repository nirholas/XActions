# ═══════════════════════════════════════════════════════════════════════════════
# XActions — Build & Push Docker Image to GitHub Container Registry
# Free container registry included with GitHub repos
# by nichxbt
# ═══════════════════════════════════════════════════════════════════════════════

name: Docker Publish

# Version tags and published releases build straight away, as before. The main
# branch image used to build on push too, in parallel with CI, so a commit that
# failed its tests was already `:main` on GHCR; it now waits for the CI workflow
# to pass on main and builds exactly the commit CI tested.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, not workflow-level: a workflow-level group would let the run a
    # red CI triggers (whose job is skipped) cancel a green commit's run.
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true

    # For workflow_run, `branches: [main]` matches the head branch name only,
    # which a fork's pull request can also be called, so require a push to
    # this repository too.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Under workflow_run, github.ref and github.sha describe the default branch
      # at the moment the run was queued, not the commit CI tested, so the
      # branch and sha tags are named from the tested commit explicitly.
      - name: Resolve the commit being built
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
