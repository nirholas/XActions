# ═══════════════════════════════════════════════════════════════════════════════
# XActions — Automated GitHub Releases
# Creates a GitHub Release with changelog on version tag push
# by nichxbt
# ═══════════════════════════════════════════════════════════════════════════════
#
# Triggers on tags like v3.0.43, v4.0.0, etc.
# Automatically generates release notes from commits since last tag.
#
# To create a release:
#   git tag v3.0.43
#   git push origin v3.0.43
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the release job writes (it creates the GitHub
# Release); the test and publish jobs run `npm ci`, which executes dependency
# install scripts, and must not hold a token that can push to the repository.
permissions:
  contents: read

jobs:
  # A tag that disagrees with package.json would create the GitHub Release and
  # then fail at `npm publish` (or publish a version nobody tagged). Check it
  # before anything else runs, so a mistyped tag stops with nothing published.
  verify-version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare tag and package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match package.json version $PKG_VERSION. Bump package.json or retag as v$PKG_VERSION."
            exit 1
          fi
          echo "Tag v$TAG_VERSION matches package.json."

      # 4.0.0 and 4.0.1 reached npm from a commit that was never pushed, so main
      # said 3.5.0 while users had 4.0.1. A tag below npm's latest would publish a
      # lower version and move `latest` backwards; stop before anything runs.
      - name: Version sorts above npm's latest
        run: node scripts/check-release.mjs

  # Runs before anything is published. A tag is not a promise that the code works,
  # so the suite has to say so first; publish-npm needs this job to pass.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: verify-version

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # Waits for the suite too: a GitHub Release for a tag whose tests fail
  # announces a version that will never reach npm.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-version, test]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${GITHUB_REF#refs/tags/}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "## What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          # Group commits by type
          echo "### Features" >> RELEASE_NOTES.md
          git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> RELEASE_NOTES.md 2>/dev/null || true
          echo "" >> RELEASE_NOTES.md
          
          echo "### Bug Fixes" >> RELEASE_NOTES.md
          git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^fix" >> RELEASE_NOTES.md 2>/dev/null || true
          echo "" >> RELEASE_NOTES.md
          
          echo "### Other Changes" >> RELEASE_NOTES.md
          git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" >> RELEASE_NOTES.md 2>/dev/null || true
          echo "" >> RELEASE_NOTES.md
          
          echo "---" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Full Changelog**: https://github.com/nirholas/xactions/compare/${PREV_TAG}...v${{ steps.version.outputs.VERSION }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Install" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo "npm install xactions@${{ steps.version.outputs.VERSION }}" >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A tag must not publish code the suite has never run against. `needs: [release, test]`
  # is the whole gate: a red test job stops the publish instead of shipping past it.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release, test]
    if: "!contains(github.ref, 'beta') && !contains(github.ref, 'alpha')"

    # id-token lets npm sign a provenance statement: the npm page then links the
    # exact commit and workflow run that built the tarball. A local publish
    # cannot produce one, which is what made 4.0.1 impossible to trace.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
