# Nothing served here is content-hashed: /js/sidebar.js keeps its name across
# every deploy, so a year of `immutable` kept returning visitors on last year's
# scripts. Scripts, styles, HTML and data revalidate after five minutes; images,
# fonts and video, which only ever look stale, after a day. Mirrors
# dashboard/_headers and api/server.js. If a build step ever emits hashed
# filenames, give that path the year-long immutable rule and nothing else.
map $uri $xactions_cache_control {
    default "public, max-age=300, must-revalidate";
    ~*\.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors dashboard/_headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $xactions_cache_control;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Marketing landing page at the root (matches the vercel.json fallthrough
    # that served site/index.html); the app dashboard lives at /dashboard
    location = / {
        try_files /landing.html =404;
    }
    location = /dashboard {
        try_files /index.html =404;
    }

    # API backend is not deployed yet: fail fast with JSON instead of an
    # HTML 404 so dashboard fetch() calls surface a clear error
    location /api/ {
        default_type application/json;
        return 503 '{"error":"API temporarily unavailable","status":503}';
    }

    # /blog/ has no index page; the blog landing page is /blog.html
    location = /blog/ {
        return 301 /blog;
    }

    # Clean URLs: /about -> /about.html, /tutorials -> /tutorials/index.html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Static assets are served as files only (no clean-URL fallbacks). No
    # add_header here, so the server-level security and Cache-Control headers
    # apply; an add_header in this block would replace all of them.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
